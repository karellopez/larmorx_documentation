# Builds the site with tools/build.py and deploys _site to GitHub Pages on
# every push to main. The build checks every internal link and anchor and
# stops on a problem, so a broken site is never published. (Links into the
# main repository are checked locally, where it is checked out next to this
# one; here they are only counted.)
#
# Pages must be set once in the repository's settings:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

name: Deploy the documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The evidence's images are not in main's history: they live on the orphan branch
      # evidence-blobs (one commit, replaced at every export; tools/blobs.py). Every blob is
      # checked against the manifest committed on main (static/evidence/blobs.sha256: full
      # SHA-256 of every blob a JSON names) before it is published; a missing, extra or altered
      # blob stops the deployment.
      - name: Check out the evidence's image blobs
        uses: actions/checkout@v7
        with:
          ref: evidence-blobs
          path: _blobs

      - name: Verify the blobs against the manifest and place them
        run: python tools/blobs.py publish-dir --dir _blobs

      - name: Install the build's requirements
        run: pip install -r requirements.txt

      - name: Build and check the site
        run: python tools/build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
