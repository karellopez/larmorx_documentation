# FreeSurfer 8.2.0's roadmap: where each wave of the work stands, each part of a wave and each
# set of reference runs. The page content/roadmap/freesurfer.md reads everything it shows about
# progress from this file, so at each merge only this file changes, never the page:
#
#   - `updated`: the day of the last change (the page's "Last updated").
#   - A status is one of "done", "in-progress", "next" or "planned", followed by the day it was
#     set: "done 2026-11-12", "in-progress 2026-11-13"; "next" and "planned" may stand alone.
#     "none" marks a side that has no port by decision (a clean room only, say), with a `note`.
#   - A wave has `replica` and `clean_room` statuses (3.0, the preparation, one `status`), and
#     optional `replica_note` and `clean_room_note`: what is done and what is under way, in
#     plain words.
#   - A wave's `parts` list its pieces of work as they begin: a part's `name`, what it holds
#     (`what`), its `replica` and `clean_room` statuses and an optional `note`. Add a part when its
#     work starts (a library module, a program or a group of programs); a part named after a
#     program shows its status beside that program in recon-all's steps.
#   - `runs`: the reference runs of FreeSurfer, each with its status.
#
# The rest of each wave (`name`, `delivers`, `size`, `programs`) is its description from the
# plan (the main repository's docs/freesurfer-plan.md, "The waves"); change it only when the
# plan changes. Names of programs and stages only: nothing taken from FreeSurfer's source
# (no source files, line numbers or functions).

updated: "2026-11-18"

waves:
  - id: "3.0"
    name: Preparation
    delivers: "The map of the work, before any port: every program the two streams and fMRIPrep run, measured on FreeSurfer's own runs; the order of the waves and the list of their pieces of work; FreeSurfer's reference runs, every step recorded; the replay tool that tests a port on those recordings; the list of FreeSurfer's data files and their licences."
    status: "done 2026-11-12"

  - id: "3.1"
    name: Foundations
    delivers: "FreeSurfer's shared library, on which every program stands: its file formats, its volume and surface structures, its mathematics, its random numbers and its messages; the 80-bit arithmetic of x86 processors that FreeSurfer's long-double numbers use; the routines it borrows from other projects; and a build of FreeSurfer's own library that checks these pieces function by function."
    size: {replica: 52, clean_room: 8}
    programs: []
    replica: "done 2026-11-18"
    replica_note: "Complete (2026-11-18), but for the pieces that belong to later waves: the B-splines (wave 3.2), DICOM series (wave 3.7) and the surface pieces of wave 3.4 (the realm trees, the parameterisation, the deformation's integration parameters). One function of the C library, the double arc cosine, stays correctly rounded in both modes, as decided for FSL: it differs from FreeSurfer's glibc in the last bit for about 0.05 % of arguments."
    clean_room: "in-progress 2026-11-13"
    clean_room_note: "The core, the random numbers, the C library's sort, the cubic spline, the mathematics and the volume structure done; the first six parts of the volumes (the geometry block, voxel arithmetic, coordinates and orientation, the samplers, the moves, the head's box, the transform reader, the label tests, the brain-volume cache, resolution, planes, flood fills, whole-factor resampling, changes of type, frame samplers and splatting, derivatives and gradients, linear transforms, resampling onto a template's grid and value replacement) written from their specification: on the open probe's 12,270 calls, no difference from FreeSurfer that a recorded defect does not explain in fix mode; in reproduce mode 2 lines differ, both values FreeSurfer takes from memory it never wrote (sent to the specification's writer); its trilinear, cubic and nearest-neighbour samplers 1.2 to 1.5 times as fast as FreeSurfer's (the windowed sinc 0.75 times, for now), its flood fill 2.3 times as fast on 64-voxel cubes, the sixth part's other functions 0.85 to 1.4 times; the rest of the volumes, the volume files and the surface files follow as their specifications are made ready."
    parts:
      - name: "FreeSurfer's library, checked function by function"
        what: "FreeSurfer 8.2.0's library built as the official release was built (the same compiler, GCC 8.4.0, and the same options), so that each piece of the foundations is compared with FreeSurfer's own functions."
        replica: "done 2026-11-12"
        clean_room: "none"
        note: "A tool for the checks, not a port."
      - name: "Numerical routines from other projects"
        what: "VXL's and netlib's routines FreeSurfer calls (minimisers, matrix decompositions), with the not-a-number values of x86-64 processors on every platform; the 80-bit arithmetic of x86 processors."
        replica: "done 2026-11-13"
        clean_room: "planned"
        note: "Their clean rooms come with the clean rooms of the permissive ports, after FreeSurfer."
      - name: "Random numbers and the C library's sort"
        what: "RANLUX with GSL's distributions, VXL's generator, `drand48` and the C library's `rand` and `random`; the C library's sort, whose order of equal items FreeSurfer's results depend on."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
        note: "GSL's generators as a replica in `larmorx-gpl`, alone; the C library's functions as clean rooms only, written from a description of their behaviour (its code is not translated)."
      - name: "The cubic spline"
        what: "John Burkardt's cubic spline (2006), which `mri_normalize` uses."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "File formats from other projects"
        what: "GIFTI surfaces, MINC's .xfm transforms, DICOM's file probe (CTN's reader), JSON and zip compression (miniz), NRRD files (NrrdIO's reader), MINC volumes, zlib's compression, TIFF and JPEG images."
        replica: "done 2026-11-17"
        clean_room: "planned"
        note: "Done: GIFTI surfaces, MINC's .xfm transforms, the DICOM probe, JSON and zip compression, NRRD files (identical to NrrdIO and to FreeSurfer's copy of it on 69,500 generated files) and reading MINC volumes (identical to MINC 1.5.1 and to FreeSurfer's copy on about 37,500 generated files; larmorx also reads the double-precision and compressed MINC files that FreeSurfer 8.2.0 cannot). Writing MINC volumes is done too (identical to MINC 1.5.1 and to FreeSurfer's copy in 17,433 comparisons; larmorx also writes the 4-D volumes FreeSurfer's copy cannot), and zlib's compression as FreeSurfer's programs load it (byte-identical on 100,300 test streams; larmorx's MGZ, .nii.gz and GIFTI files now match FreeSurfer's byte for byte, not only in their contents). JPEG images (IJG libjpeg 6b: identical to it and to FreeSurfer's copy on 26,526 test files). TIFF images (libtiff 3.6.1, as FreeSurfer builds it): reading identical to it and to FreeSurfer's copy on 20,000 of 25,000 generated files; of the other 5,000, the original crashed or hung on about 2,050 and gave results that depend on memory contents on about 550 (larmorx names each case), and about 2,400 used five rarer compressions then not yet ported; writing byte-identical on 5,300 files. Those five compressions (CCITT fax, PixarLog, SGILog, ThunderScan, NeXT) are now ported too, so larmorx reads every compression FreeSurfer's copy reads: on 21,000 further generated files covering all of them, 0 differ, and 1,000 more written files are byte-identical. Two defects found in them change results on valid images (the word alignment of one fax compression, and a size overflow that makes every SGILog image stored without a RowsPerStrip tag fail to read); larmorx corrects both by default and reproduces them on request. CTN's DICOM element reading is done too (identical to CTN 3.0.6 and to FreeSurfer's copy on 10,038 generated files). The reads into no buffer behave as libtiff's do too (27,000 probe reads, 0 differing), which completes the replica of this part. Their clean rooms come with the clean rooms of the permissive ports, after FreeSurfer."
      - name: "The core"
        what: "Messages and diagnostics, the program's name and environment, version stamps, timers, paths, threads, the licence check's messages."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "The mathematics"
        what: "Matrices in single and extended precision, the numerical routines and optimisers, histograms, statistics, probability distributions, random fields."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "The volume structure"
        what: "FreeSurfer's volume in memory, its geometry, and the linear transform files (LTA)."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "Volume files"
        what: "Reading and writing volumes (MGH and MGZ, NIfTI, ANALYZE, DICOM and others), FreeSurfer's tags, the binary colour tables, the detection of a file's format."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: MRIread, the entry through which every FreeSurfer program reads a volume, volume reordering (mri_convert's -r; FreeSurfer crashes on some huge values through a 32-bit overflow, larmorx refuses them with FreeSurfer's message) (a damaged header asking for an impossible number of frames is refused at once, as FreeSurfer does), the tags, the colour tables, the format detection, the DICOM probe, Siemens mosaics, MATLAB and Bruker files, 2-D images, reading a volume's header, GIFTI volumes, writing volumes, the MGH/MGZ writer, NIfTI files (.nii, .nii.gz and the .hdr/.img pairs) read and written, ANALYZE, COR, bshort and bfloat, GDF and SDT volumes, GE Genesis and LX (which FreeSurfer 8.2.0 itself cannot read: larmorx reads them, and reproduces the crash on request), GE Signa and XIMG, the old Siemens .ima series, AFNI datasets, curvature and annotation files read as volumes, image files (MATLAB, SGI and HIPS) read and written as volumes, ITK warp files written, NRRD files read as volumes (FreeSurfer misplaces some of them in space: larmorx places them correctly by default and reproduces FreeSurfer's placement on request), FreeSurfer's probabilistic atlases (GCA files) read as volumes (identical voxel for voxel to FreeSurfer's own mri_convert on its four atlases, a little faster and with less memory), MINC files read and written as volumes (FreeSurfer's writer loses some integer volumes and NaN-led ranges: larmorx writes them correctly by default and reproduces FreeSurfer on request), FreeSurfer's refusals to write AFNI and NRRD files, FreeSurfer's way of reading a number cut short at the end of a file, and the atlas warps (.m3z files) read as volumes (the warps of six recorded heads: 108 of 108 volumes identical to FreeSurfer's) and written (those six warps read and written again: 30 of 30 outputs identical to FreeSurfer's), warp maps converted between formats when written, and JPEG and TIFF images read and written as volumes (the image readers and writers, TIFF included: identical to FreeSurfer on all 1,744 compared cases of 2,400 generated ones), and FreeSurfer's autoencoder files (.ae, .sae, .csae) read as volumes. Where FreeSurfer's readers leave memory it never wrote in a volume (fields of damaged .mgz files, the geometry of a warp read without it), larmorx writes defined values and says so; where that memory is predictable (the .mgz reader keeps the previous number's bytes), it reproduces FreeSurfer's values on request. Still to do: DICOM series as volumes, planned with the completeness work (DICOM's element reading is done)."
      - name: "Volumes"
        what: "Voxels and frames, conforming, regions, resampling, transforms (LTA, .xfm, FSL's matrices), the Talairach helpers, warp fields."
        replica: "done 2026-11-18"
        clean_room: "in-progress 2026-11-17"
        note: "Done: the volume geometry, voxel arithmetic, coordinates, samplers, moves and rotations, the head's bounding box, reading transforms, the CMA labels, resizing and type changes, splatting, derivatives, the linear transforms and their operations (inverse, concatenation, change of type), their writers in every format FreeSurfer writes (.lta, MINC's .xfm, register.dat, FSL's matrices), applying them to volumes and points, the rotation and affine-parameter helpers, the voxel lists, resampling to another volume, statistics and orientation, the volume fractions, PCA, the Talairach helpers and volumes, conforming, dilations and set operations, histograms, segmentations mapped onto volumes, segment statistics, crops, and the rest of FreeSurfer's general volume functions (volume-to-volume filling, the topology-preserving erosion and dilation, the subcortical mass fix, binary morphology), and FreeSurfer's general transform, a linear transform or an atlas warp (reading, writing, copying, inversion, sampling, composition, concatenation, the voxel and RAS conversions, and resampling a volume through it, linear or an atlas warp, in both directions). FreeSurfer lays every row of a tensor volume over its first row in the functions that walk a volume directly; larmorx gives each row its own place by default and reproduces FreeSurfer's layout on request. Left for the surface waves: the volume functions that need the surfaces."
      - name: "Surface files"
        what: "The surface structure and its files: surfaces, curvatures, patches and overlays, and the measures computed when a surface is read."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: the surface readers and writers (curvature, patches, STL, triangle and quadrangle files, GIFTI), the curvature files in every format FreeSurfer writes (48 of 48 recorded files identical), value files, patches, normals, vertex positions and annotations read and written (60 of 60 recorded files identical), reading whole surfaces, the surface measures (normals, cortical thickness, curvatures), the quality statistics recon-all prints, and the surface-to-volume functions (a surface's interior filled into a volume, the cortical ribbon, bounding volumes: identical to FreeSurfer on 24 of 24 volumes of three recorded heads, and faster than FreeSurfer: 38 s against 55 s), surfaces turned into masks and the laminar volume fractions (identical to FreeSurfer on generated surfaces), the Talairach coordinates of surface points, the vertex-to-voxel conversions, the distributions of normals and curvatures and the triangle energy (6 of 6 recorded heads identical), a surface's values written into a volume and value files, the copies between vertex fields, and the area, distance and mark files (recon-all's area files of 3 recorded heads written byte for byte, 12 of 12), the surface hash table and the triangle tests that find where a surface crosses itself, and the filling of holes on a surface (56 of 60 runs on recorded surfaces identical to FreeSurfer; on the other 4 FreeSurfer itself crashes, and larmorx finishes), and the surface marks, the value filters (average, median, Gaussian, mode, soap bubble) and the distance sampling the spherical registration uses (no difference from FreeSurfer in 2,000 generated cases), and the rest of the surface values: excluding and restoring regions, growing and shrinking marked regions, the annotation filter and disks of a given radius (78 of 78 runs on recorded heads identical to FreeSurfer in the reproduce mode; by default larmorx also finds the disks beyond about 40 mm that FreeSurfer's binarize step refuses), the surface's topology (Euler numbers, edge and neighbour edits, removing excluded vertices, renumbering: the Euler numbers of the six recorded heads as recon-all's, 24 of 24 recorded runs identical in the reproduce mode) and the soap-bubble smoothings (12 of 12 recorded runs identical in both modes). When FreeSurfer removes excluded vertices it leaves the other vertices' neighbour lists stale, which happens every time recon-all cuts away what lies outside the cortex label; larmorx corrects it by default and reproduces it on request. Then the closest-vertex and closest-face searches and the sphere, cylinder and ellipsoid projections (6 of 6 recorded runs identical for each, in both modes), projecting a surface onto another and flattening a patch, removing a surface's self-intersections, and a surface's distance into a volume (54 of 60 recorded runs identical in both modes; on the other 6 FreeSurfer itself crashes, and larmorx finishes). Also done: reading patches, the sampled energies and the triangle overlaps (6 of 6 recorded runs identical in both modes), and moving a surface through FreeSurfer's general transform (108 of 108 recorded cases identical in both modes). Left for wave 3.4: the pieces that need its modules (the realm trees, the parameterisation, the deformation's integration parameters)."
      - name: "Labels"
        what: "Colour tables, annotations, labels, register.dat files, control points, point sets."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: colour tables, registration files, labels, annotations, control points, point sets, the label coordinate conversions, the removal of overlapping labels, and labels on surfaces: marking, area, filling, erosion and dilation, inversion, masks (24 of 24 recorded labels identical), and the removal of holes and islands from surface labels, on FreeSurfer's surface clusters ported whole (36 of 36 comparisons on recorded heads identical). FreeSurfer's cluster growth crashes once it nests about 104,000 levels deep; whole recorded hemispheres reach about 87,000, so only denser surfaces would crash. larmorx grows every cluster in full and says so when FreeSurfer would have crashed. Flattening a label and cutting away what lies outside it are done too (24 of 24 recorded runs identical in the reproduce mode)."
      - name: "Volume filters"
        what: "Filters and morphology, intensity normalisation, segmentation helpers, flood fill, connected components, fast marching, clusters."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: the distance maps (fast marching), Gaussian smoothing and convolutions, Sobel filters, the white-matter border classification, connected components, the frame functions, clusters, the non-parametric tissue classification, connected segments, the flood fill of volumes, the bias fields, the intensity normalisation of recon-all's T1 step (identical to FreeSurfer on three recorded heads, and now faster than FreeSurfer with the same output: 69 s against 126 s for the normalisation's nine runs on three recorded heads), the high-signal control points of mri_normalize's -snr option, and the mask from a T2 image and the aparc+aseg segmentation (identical to FreeSurfer on 5 of 6 recorded volumes; on the sixth FreeSurfer itself crashes). More speed work comes with the programs that use these filters."

  - id: "3.2"
    name: Volumes
    delivers: "The volume programs both streams run, from the input image to the white-matter volume, with ITK's N4 bias correction and denoising as FreeSurfer builds them; and fMRIPrep's own volume programs early (`mri_coreg`, `mri_robust_template`, `mri_robust_register`), with EPFL's B-splines and the robust-registration library as pieces of their own; the `freesurfer` family of the larmorx command and `lx.freesurfer` in Python."
    size: {replica: 41, clean_room: 30}
    programs: [mri_convert, mri_info, mri_add_xform_to_header, lta_convert, mri_robust_template, mri_normalize, mri_mask, mri_cc, mri_edit_wm_with_aseg, AntsDenoiseImageFs, AntsN4BiasFieldCorrectionFs, mri_segment, mri_pretess, mri_fill, mri_binarize, mri_segstats, mris_calc, mri_make_uchar, mri_vol2vol, mri_concat, mri_label2vol, mri_robust_register, mri_coreg, fs_temp_file, mri_nu_correct.mni, seg2cc, mergeseg, getfullpath]
    replica: "in-progress 2026-11-18"
    replica_note: "Started 2026-11-18, one program or library piece at a time: first EPFL's B-splines, which many of the wave's programs use; next the intensity normalisation (`mri_normalize`), the format converter (`mri_convert`) and the robust-registration library."
    clean_room: "planned"
    parts:
      - name: "EPFL's B-splines"
        what: "Cubic and higher-degree B-spline coefficients, sampling, transforms and the halving and doubling pyramids that FreeSurfer's resampling and robust registration use."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Every degree from 2 to 9. Checked against FreeSurfer's own library build with the volume probe's 28,600 random calls (every volume function, the B-splines' new calls included) in reproduce mode: 26,580 identical, 0 different, the other 2,020 not comparable (calls on which FreeSurfer crashes or never returns). Computing the coefficients of a 256-voxel cube takes 0.54 s against FreeSurfer's 0.52 s with 2 to 3 % less memory; transforming a 128-voxel cube is still slower (0.49 s against 0.35 s), for a later speed step. Four new defects of FreeSurfer recorded (FS-962 to FS-965). Its specification for the clean room is written."
      - name: "mri_normalize"
        what: "The intensity normalisation of recon-all's T1 and brain steps: white matter scaled to 110, with control points, a brain mask from the atlas, and the white-matter outliers near the segmentation removed."
        replica: "in-progress 2026-11-18"
        clean_room: "planned"
        note: "Part 1 of 2 done: the program's own steps and every option's parsing. Checked against FreeSurfer's own code built as a library: 900 random calls with no difference in reproduce mode; on three recorded subjects, the atlas brain mask and the white-matter outlier removal give outputs identical to FreeSurfer's in both modes (12 of 12), for now in 79 s against FreeSurfer's 66 s. Part 2 assembles the program and replays its 24 recorded steps."
      - name: "mri_convert"
        what: "The format converter both streams start with: reading and writing every volume format, conforming to 256 cubed, changing type, resampling and reorienting, and its statistics tables."
        replica: "in-progress 2026-11-18"
        clean_room: "planned"
        note: "Parts 1 and half of 2 (of 4) done: the statistics tables and every option's parsing and checks. Checked against FreeSurfer's program built with print hooks, every setting the options make compared: of 1,000 random command lines, 947 identical in reproduce mode, 0 different, 53 not comparable (FreeSurfer crashes or reads memory it does not own). The reading, conforming and writing steps follow, then the replay of its 24 recorded steps."
      - name: "The robust-registration library"
        what: "Reuter's robust registration, shared by `mri_robust_register` and `mri_robust_template` (both run by fMRIPrep): image scaling, subsampling, blurring and gradients, principal axes, matrix decompositions and transform distances, then the registration itself."
        replica: "in-progress 2026-11-18"
        clean_room: "planned"
        note: "Part 1 of 2 begun: the helpers both programs reach, but the matrix square root. Checked against FreeSurfer's own files built with its flags: 16,100 random calls, 15,737 identical, 0 different, 363 not comparable (FreeSurfer crashes, hangs or reads memory it does not own). The blur and the gradients are for now about four times slower than FreeSurfer's and use more memory (a filter of the foundations keeps an extra copy; it is the next step of that filter's track). Three new defects of FreeSurfer recorded (FS-966 to FS-968)."

