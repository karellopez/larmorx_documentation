# FreeSurfer 8.2.0's roadmap: where each wave of the work stands, each part of a wave and each
# set of reference runs. The page content/roadmap/freesurfer.md reads everything it shows about
# progress from this file, so at each merge only this file changes, never the page:
#
#   - `updated`: the day of the last change (the page's "Last updated").
#   - A status is one of "done", "in-progress", "next" or "planned", followed by the day it was
#     set: "done 2026-11-12", "in-progress 2026-11-13"; "next" and "planned" may stand alone.
#     "none" marks a side that has no port by decision (a clean room only, say), with a `note`.
#   - A wave has `replica` and `clean_room` statuses (3.0, the preparation, one `status`), and
#     optional `replica_note` and `clean_room_note`: what is done and what is under way, in
#     plain words.
#   - A wave's `parts` list its pieces of work as they begin: a part's `name`, what it holds
#     (`what`), its `replica` and `clean_room` statuses and an optional `note`. Add a part when its
#     work starts (a library module, a program or a group of programs); a part named after a
#     program shows its status beside that program in recon-all's steps.
#   - `runs`: the reference runs of FreeSurfer, each with its status.
#
# The rest of each wave (`name`, `delivers`, `size`, `programs`) is its description from the
# plan (the main repository's docs/freesurfer-plan.md, "The waves"); change it only when the
# plan changes. Names of programs and stages only: nothing taken from FreeSurfer's source
# (no source files, line numbers or functions).

updated: "2026-11-18"

waves:
  - id: "3.0"
    name: Preparation
    delivers: "The map of the work, before any port: every program the two streams and fMRIPrep run, measured on FreeSurfer's own runs; the order of the waves and the list of their pieces of work; FreeSurfer's reference runs, every step recorded; the replay tool that tests a port on those recordings; the list of FreeSurfer's data files and their licences."
    status: "done 2026-11-12"

  - id: "3.1"
    name: Foundations
    delivers: "FreeSurfer's shared library, on which every program stands: its file formats, its volume and surface structures, its mathematics, its random numbers and its messages; the 80-bit arithmetic of x86 processors that FreeSurfer's long-double numbers use; the routines it borrows from other projects; and a build of FreeSurfer's own library that checks these pieces function by function."
    size: {replica: 52, clean_room: 8}
    programs: []
    replica: "done 2026-11-18"
    replica_note: "Complete (2026-11-18), but for the pieces that belong to later waves: the B-splines (wave 3.2), DICOM series (wave 3.7) and the surface pieces of wave 3.4 (the realm trees, the parameterisation, the deformation's integration parameters). One function of the C library, the double arc cosine, stays correctly rounded in both modes, as decided for FSL: it differs from FreeSurfer's glibc in the last bit for about 0.05 % of arguments."
    clean_room: "in-progress 2026-11-13"
    clean_room_note: "The core, the random numbers, the C library's sort, the cubic spline, the mathematics and the volume structure done; the first eight parts of the volumes (the geometry block, voxel arithmetic, coordinates and orientation, the samplers, the moves, the head's box, the transform reader, the label tests, the brain-volume cache, resolution, planes, flood fills, whole-factor resampling, changes of type, frame samplers and splatting, derivatives and gradients, linear transforms, resampling onto a template's grid, value replacement, since 2026-11-19 the statistics and their print, the type names, the box crop, orientation strings and the voxel-to-world matrices, since 2026-11-21 slices as images, neighbourhoods and label counts, and the transform files' inversion and physical-voxel conversion, and since 2026-11-22 the changes between the voxel, RAS-to-RAS and physical-voxel transform types, the partial-volume label counts, random and constant volumes, frame normalisations, sorts and orders, the voxelwise operations, the rest of the transform files' functions (their changes to and from register.dat, FSL's and coronal RAS, inversion, concatenation, reduction, source and target tests and print), and segmentations mapped onto another grid, segment borders and statistics, edits, shifts and crops) written from their specification, their cubic B-spline paths through the B-splines' clean room (wave 3.2): on the open probe's 16,422 calls (47 groups, the B-splines' included), no difference from FreeSurfer that a recorded defect does not explain, in either mode (3 lines of a border voxel's label that FreeSurfer reads from outside its table, FS-469, the same on each of its runs, count as explained since 2026-11-22); the two values FreeSurfer reads from memory it never wrote (FS-300, FS-325), found the same on every run by the specification's writer, now count as explained; its trilinear, cubic and nearest-neighbour samplers 1.2 to 1.5 times as fast as FreeSurfer's (the windowed sinc 0.75 times, for now), its flood fill 2.3 times as fast on 64-voxel cubes, the sixth part's other functions 0.85 to 1.4 times, the seventh's from 0.6 times (the label borders) to 6.2 times (the parcellation smoothing), the eighth's 0.78 to 1.39 times; the specification of the next part (resampling onto another volume, through a shift map too, a segmentation's mapping with upsampling, and regions with their bounding boxes) ready since 2026-11-22 for the clean room's next relay; the rest of the volumes, the volume files and the surface files follow as their specifications are made ready."
    parts:
      - name: "FreeSurfer's library, checked function by function"
        what: "FreeSurfer 8.2.0's library built as the official release was built (the same compiler, GCC 8.4.0, and the same options), so that each piece of the foundations is compared with FreeSurfer's own functions."
        replica: "done 2026-11-12"
        clean_room: "none"
        note: "A tool for the checks, not a port."
      - name: "Numerical routines from other projects"
        what: "VXL's and netlib's routines FreeSurfer calls (minimisers, matrix decompositions), with the not-a-number values of x86-64 processors on every platform; the 80-bit arithmetic of x86 processors."
        replica: "done 2026-11-13"
        clean_room: "planned"
        note: "Their clean rooms come with the clean rooms of the permissive ports, after FreeSurfer."
      - name: "Random numbers and the C library's sort"
        what: "RANLUX with GSL's distributions, VXL's generator, `drand48` and the C library's `rand` and `random`; the C library's sort, whose order of equal items FreeSurfer's results depend on."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
        note: "GSL's generators as a replica in `larmorx-gpl`, alone; the C library's functions as clean rooms only, written from a description of their behaviour (its code is not translated)."
      - name: "The cubic spline"
        what: "John Burkardt's cubic spline (2006), which `mri_normalize` uses."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "File formats from other projects"
        what: "GIFTI surfaces, MINC's .xfm transforms, DICOM's file probe (CTN's reader), JSON and zip compression (miniz), NRRD files (NrrdIO's reader), MINC volumes, zlib's compression, TIFF and JPEG images."
        replica: "done 2026-11-17"
        clean_room: "planned"
        note: "Done: GIFTI surfaces, MINC's .xfm transforms, the DICOM probe, JSON and zip compression, NRRD files (identical to NrrdIO and to FreeSurfer's copy of it on 69,500 generated files) and reading MINC volumes (identical to MINC 1.5.1 and to FreeSurfer's copy on about 37,500 generated files; larmorx also reads the double-precision and compressed MINC files that FreeSurfer 8.2.0 cannot). Writing MINC volumes is done too (identical to MINC 1.5.1 and to FreeSurfer's copy in 17,433 comparisons; larmorx also writes the 4-D volumes FreeSurfer's copy cannot), and zlib's compression as FreeSurfer's programs load it (byte-identical on 100,300 test streams; larmorx's MGZ, .nii.gz and GIFTI files now match FreeSurfer's byte for byte, not only in their contents). JPEG images (IJG libjpeg 6b: identical to it and to FreeSurfer's copy on 26,526 test files). TIFF images (libtiff 3.6.1, as FreeSurfer builds it): reading identical to it and to FreeSurfer's copy on 20,000 of 25,000 generated files; of the other 5,000, the original crashed or hung on about 2,050 and gave results that depend on memory contents on about 550 (larmorx names each case), and about 2,400 used five rarer compressions then not yet ported; writing byte-identical on 5,300 files. Those five compressions (CCITT fax, PixarLog, SGILog, ThunderScan, NeXT) are now ported too, so larmorx reads every compression FreeSurfer's copy reads: on 21,000 further generated files covering all of them, 0 differ, and 1,000 more written files are byte-identical. Two defects found in them change results on valid images (the word alignment of one fax compression, and a size overflow that makes every SGILog image stored without a RowsPerStrip tag fail to read); larmorx corrects both by default and reproduces them on request. CTN's DICOM element reading is done too (identical to CTN 3.0.6 and to FreeSurfer's copy on 10,038 generated files). The reads into no buffer behave as libtiff's do too (27,000 probe reads, 0 differing), which completes the replica of this part. Their clean rooms come with the clean rooms of the permissive ports, after FreeSurfer."
      - name: "The core"
        what: "Messages and diagnostics, the program's name and environment, version stamps, timers, paths, threads, the licence check's messages."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "The mathematics"
        what: "Matrices in single and extended precision, the numerical routines and optimisers, histograms, statistics, probability distributions, random fields."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "The volume structure"
        what: "FreeSurfer's volume in memory, its geometry, and the linear transform files (LTA)."
        replica: "done 2026-11-13"
        clean_room: "done 2026-11-13"
      - name: "Volume files"
        what: "Reading and writing volumes (MGH and MGZ, NIfTI, ANALYZE, DICOM and others), FreeSurfer's tags, the binary colour tables, the detection of a file's format."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: MRIread, the entry through which every FreeSurfer program reads a volume, volume reordering (mri_convert's -r; FreeSurfer crashes on some huge values through a 32-bit overflow, larmorx refuses them with FreeSurfer's message) (a damaged header asking for an impossible number of frames is refused at once, as FreeSurfer does), the tags, the colour tables, the format detection, the DICOM probe, Siemens mosaics, MATLAB and Bruker files, 2-D images, reading a volume's header, GIFTI volumes, writing volumes, the MGH/MGZ writer, NIfTI files (.nii, .nii.gz and the .hdr/.img pairs) read and written, ANALYZE, COR, bshort and bfloat, GDF and SDT volumes, GE Genesis and LX (which FreeSurfer 8.2.0 itself cannot read: larmorx reads them, and reproduces the crash on request), GE Signa and XIMG, the old Siemens .ima series, AFNI datasets, curvature and annotation files read as volumes, image files (MATLAB, SGI and HIPS) read and written as volumes, ITK warp files written, NRRD files read as volumes (FreeSurfer misplaces some of them in space: larmorx places them correctly by default and reproduces FreeSurfer's placement on request), FreeSurfer's probabilistic atlases (GCA files) read as volumes (identical voxel for voxel to FreeSurfer's own mri_convert on its four atlases, a little faster and with less memory), MINC files read and written as volumes (FreeSurfer's writer loses some integer volumes and NaN-led ranges: larmorx writes them correctly by default and reproduces FreeSurfer on request), FreeSurfer's refusals to write AFNI and NRRD files, FreeSurfer's way of reading a number cut short at the end of a file, and the atlas warps (.m3z files) read as volumes (the warps of six recorded heads: 108 of 108 volumes identical to FreeSurfer's) and written (those six warps read and written again: 30 of 30 outputs identical to FreeSurfer's), warp maps converted between formats when written, and JPEG and TIFF images read and written as volumes (the image readers and writers, TIFF included: identical to FreeSurfer on all 1,744 compared cases of 2,400 generated ones), and FreeSurfer's autoencoder files (.ae, .sae, .csae) read as volumes. Where FreeSurfer's readers leave memory it never wrote in a volume (fields of damaged .mgz files, the geometry of a warp read without it), larmorx writes defined values and says so; where that memory is predictable (the .mgz reader keeps the previous number's bytes), it reproduces FreeSurfer's values on request. Still to do: DICOM series as volumes, planned with the completeness work (DICOM's element reading is done)."
      - name: "Volumes"
        what: "Voxels and frames, conforming, regions, resampling, transforms (LTA, .xfm, FSL's matrices), the Talairach helpers, warp fields."
        replica: "done 2026-11-18"
        clean_room: "in-progress 2026-11-17"
        note: "Done: the volume geometry, voxel arithmetic, coordinates, samplers, moves and rotations, the head's bounding box, reading transforms, the CMA labels, resizing and type changes, splatting, derivatives, the linear transforms and their operations (inverse, concatenation, change of type), their writers in every format FreeSurfer writes (.lta, MINC's .xfm, register.dat, FSL's matrices), applying them to volumes and points, the rotation and affine-parameter helpers, the voxel lists, resampling to another volume, statistics and orientation, the volume fractions, PCA, the Talairach helpers and volumes, conforming, dilations and set operations, histograms, segmentations mapped onto volumes, segment statistics, crops, and the rest of FreeSurfer's general volume functions (volume-to-volume filling, the topology-preserving erosion and dilation, the subcortical mass fix, binary morphology), and FreeSurfer's general transform, a linear transform or an atlas warp (reading, writing, copying, inversion, sampling, composition, concatenation, the voxel and RAS conversions, and resampling a volume through it, linear or an atlas warp, in both directions). FreeSurfer lays every row of a tensor volume over its first row in the functions that walk a volume directly; larmorx gives each row its own place by default and reproduces FreeSurfer's layout on request. Left for the surface waves: the volume functions that need the surfaces."
      - name: "Surface files"
        what: "The surface structure and its files: surfaces, curvatures, patches and overlays, and the measures computed when a surface is read."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: the surface readers and writers (curvature, patches, STL, triangle and quadrangle files, GIFTI), the curvature files in every format FreeSurfer writes (48 of 48 recorded files identical), value files, patches, normals, vertex positions and annotations read and written (60 of 60 recorded files identical), reading whole surfaces, the surface measures (normals, cortical thickness, curvatures), the quality statistics recon-all prints, and the surface-to-volume functions (a surface's interior filled into a volume, the cortical ribbon, bounding volumes: identical to FreeSurfer on 24 of 24 volumes of three recorded heads, and faster than FreeSurfer: 38 s against 55 s), surfaces turned into masks and the laminar volume fractions (identical to FreeSurfer on generated surfaces), the Talairach coordinates of surface points, the vertex-to-voxel conversions, the distributions of normals and curvatures and the triangle energy (6 of 6 recorded heads identical), a surface's values written into a volume and value files, the copies between vertex fields, and the area, distance and mark files (recon-all's area files of 3 recorded heads written byte for byte, 12 of 12), the surface hash table and the triangle tests that find where a surface crosses itself, and the filling of holes on a surface (56 of 60 runs on recorded surfaces identical to FreeSurfer; on the other 4 FreeSurfer itself crashes, and larmorx finishes), and the surface marks, the value filters (average, median, Gaussian, mode, soap bubble) and the distance sampling the spherical registration uses (no difference from FreeSurfer in 2,000 generated cases), and the rest of the surface values: excluding and restoring regions, growing and shrinking marked regions, the annotation filter and disks of a given radius (78 of 78 runs on recorded heads identical to FreeSurfer in the reproduce mode; by default larmorx also finds the disks beyond about 40 mm that FreeSurfer's binarize step refuses), the surface's topology (Euler numbers, edge and neighbour edits, removing excluded vertices, renumbering: the Euler numbers of the six recorded heads as recon-all's, 24 of 24 recorded runs identical in the reproduce mode) and the soap-bubble smoothings (12 of 12 recorded runs identical in both modes). When FreeSurfer removes excluded vertices it leaves the other vertices' neighbour lists stale, which happens every time recon-all cuts away what lies outside the cortex label; larmorx corrects it by default and reproduces it on request. Then the closest-vertex and closest-face searches and the sphere, cylinder and ellipsoid projections (6 of 6 recorded runs identical for each, in both modes), projecting a surface onto another and flattening a patch, removing a surface's self-intersections, and a surface's distance into a volume (54 of 60 recorded runs identical in both modes; on the other 6 FreeSurfer itself crashes, and larmorx finishes). Also done: reading patches, the sampled energies and the triangle overlaps (6 of 6 recorded runs identical in both modes), and moving a surface through FreeSurfer's general transform (108 of 108 recorded cases identical in both modes). Left for wave 3.4: the pieces that need its modules (the realm trees, the parameterisation, the deformation's integration parameters)."
      - name: "Labels"
        what: "Colour tables, annotations, labels, register.dat files, control points, point sets."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: colour tables, registration files, labels, annotations, control points, point sets, the label coordinate conversions, the removal of overlapping labels, and labels on surfaces: marking, area, filling, erosion and dilation, inversion, masks (24 of 24 recorded labels identical), and the removal of holes and islands from surface labels, on FreeSurfer's surface clusters ported whole (36 of 36 comparisons on recorded heads identical). FreeSurfer's cluster growth crashes once it nests about 104,000 levels deep; whole recorded hemispheres reach about 87,000, so only denser surfaces would crash. larmorx grows every cluster in full and says so when FreeSurfer would have crashed. Flattening a label and cutting away what lies outside it are done too (24 of 24 recorded runs identical in the reproduce mode)."
      - name: "Volume filters"
        what: "Filters and morphology, intensity normalisation, segmentation helpers, flood fill, connected components, fast marching, clusters."
        replica: "done 2026-11-18"
        clean_room: "planned"
        note: "Done: the distance maps (fast marching), Gaussian smoothing and convolutions, Sobel filters, the white-matter border classification, connected components, the frame functions, clusters, the non-parametric tissue classification, connected segments, the flood fill of volumes, the bias fields, the intensity normalisation of recon-all's T1 step (identical to FreeSurfer on three recorded heads, and now faster than FreeSurfer with the same output: 69 s against 126 s for the normalisation's nine runs on three recorded heads), the high-signal control points of mri_normalize's -snr option, and the mask from a T2 image and the aparc+aseg segmentation (identical to FreeSurfer on 5 of 6 recorded volumes; on the sixth FreeSurfer itself crashes). More speed work comes with the programs that use these filters."

  - id: "3.2"
    name: Volumes
    delivers: "The volume programs both streams run, from the input image to the white-matter volume, with ITK's N4 bias correction and denoising as FreeSurfer builds them; and fMRIPrep's own volume programs early (`mri_coreg`, `mri_robust_template`, `mri_robust_register`), with EPFL's B-splines and the robust-registration library as pieces of their own; the `freesurfer` family of the larmorx command and `lx.freesurfer` in Python."
    size: {replica: 41, clean_room: 30}
    programs: [mri_convert, mri_info, mri_add_xform_to_header, lta_convert, mri_robust_template, mri_normalize, mri_mask, mri_cc, mri_edit_wm_with_aseg, AntsDenoiseImageFs, AntsN4BiasFieldCorrectionFs, mri_segment, mri_pretess, mri_fill, mri_binarize, mri_segstats, mris_calc, mri_make_uchar, mri_vol2vol, mri_concat, mri_label2vol, mri_robust_register, mri_coreg, fs_temp_file, mri_nu_correct.mni, seg2cc, mergeseg, getfullpath]
    replica: "in-progress 2026-11-18"
    replica_note: "Started 2026-11-18, one program or library piece at a time: first EPFL's B-splines, which many of the wave's programs use; next the intensity normalisation (`mri_normalize`, complete 2026-11-19), the format converter (`mri_convert`, complete 2026-11-22), the header report (`mri_info`, complete 2026-11-22), the header's transform name (`mri_add_xform_to_header`, complete 2026-11-22), the transform converter (`lta_convert`, complete 2026-11-22), the temporary files and full paths (`fs_temp_file`, `getfullpath`, complete 2026-11-22), the robust-registration library and its program (`mri_robust_register`, under way), the label masks (`mri_binarize`, complete 2026-11-21), the region statistics (`mri_segstats`, complete 2026-11-22), the value arithmetic (`mris_calc`, complete 2026-11-22), the byte conversion of the bias-corrected volume (`mri_make_uchar`, complete 2026-11-22) and the masks (`mri_mask`, complete 2026-11-22)."
    clean_room: "in-progress 2026-11-19"
    clean_room_note: "Started 2026-11-19 with EPFL's B-splines, written from their specification alone (complete 2026-11-21); the programs follow as their specifications are made ready."
    parts:
      - name: "EPFL's B-splines"
        what: "Cubic and higher-degree B-spline coefficients, sampling, transforms and the halving and doubling pyramids that FreeSurfer's resampling and robust registration use."
        replica: "done 2026-11-18"
        clean_room: "done 2026-11-21"
        note: "Every degree from 2 to 9. Checked against FreeSurfer's own library build with the volume probe's 28,600 random calls (every volume function, the B-splines' new calls included) in reproduce mode: 26,580 identical, 0 different, the other 2,020 not comparable (calls on which FreeSurfer crashes or never returns). Computing the coefficients of a 256-voxel cube takes 0.54 s against FreeSurfer's 0.52 s with 2 to 3 % less memory; transforming a 128-voxel cube is still slower (0.49 s against 0.35 s), for a later speed step. Four new defects of FreeSurfer recorded (FS-962 to FS-965). Its clean room (2026-11-19), written from the specification alone: the coefficients, sampling at every degree, the three transforms and both pyramids; on the open probe's B-spline calls no difference that a recorded defect does not explain in fix mode, and since 2026-11-21, with the physical-voxel transforms, none in reproduce mode either; as fast as FreeSurfer's or up to 1.4 times faster (a 128-voxel cube's coefficients in 0.052 s against 0.063 to 0.067 s, at one thread)."
      - name: "mri_normalize"
        what: "The intensity normalisation of recon-all's T1 and brain steps: white matter scaled to 110, with control points, a brain mask from the atlas, and the white-matter outliers near the segmentation removed."
        replica: "done 2026-11-19"
        clean_room: "planned"
        note: "Complete. recon-all's 24 recorded steps in 12 runs (six subjects, the classic and v8 streams) replayed: outputs identical to the recorded ones in both modes (24 of 24). The whole program against FreeSurfer's official program on 82 command lines covering every option and failure, two seeds: 0 different in reproduce mode (58 and 59 identical; the others counted apart: not comparable, where FreeSurfer crashes or reads memory it does not own, or differing only in FreeSurfer's error text after a failed file open, a known difference not yet modelled). Its parts were checked earlier against FreeSurfer's own code built as a library (900 random calls, no difference). Peak memory 566 MiB against FreeSurfer's 570 MiB on the T1 step and 1,173 MiB on the brain step. Still slower: 79 s against FreeSurfer's 66 s on three recorded subjects' 12 steps; the time goes to per-voxel reads and writes, for a later speed step. One new defect of FreeSurfer (FS-1017: it crashes when a step gives it no volume; larmorx stops with a clear error)."
      - name: "mri_convert"
        what: "The format converter both streams start with: reading and writing every volume format, conforming to 256 cubed, changing type, resampling and reorienting, and its statistics tables."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete; it runs as the larmorx-freesurfer program `mri_convert`: the statistics tables, every option's parsing and checks, the whole conversion (reading, header changes, transforms, type changes, reslicing, reorienting, cropping and writing) and the outline reader (`.otl` slice series). recon-all's 24 recorded `mri_convert` steps on six heads, replayed: 24 identical in reproduce mode and 24 in fix mode. fMRIPrep's only call, its licence check, gives the same volume and messages as FreeSurfer's official program. Against FreeSurfer's program built with print hooks, in reproduce mode: the options on 1,000 random command lines, 947 identical, 0 different, 53 not comparable (FreeSurfer crashes or reads memory it does not own); whole conversions, every written file compared, on 1,400 random command lines of two seeds, 1,334 identical, 0 different, 66 not comparable; outline series on 520 cases of three seeds, 462 identical, 0 different, 58 not comparable. Peak memory below FreeSurfer's (26 to 27 MiB against 28 for the conformed volume, 22 against 23 for a NIfTI conversion). Still slower: the 24 steps take 70 s at one thread against FreeSurfer's 46 s at four, most of it the resampling into 256 cubed (3.4 s against 1.2 s per conformed volume), for a later speed step. Twenty-three new defects of FreeSurfer recorded (FS-1043 to FS-1060 and FS-1141 to FS-1145); none changes a result of recon-all's or fMRIPrep's calls (one is a line their logs print, which larmorx prints with a defined value)."
      - name: "mri_info"
        what: "The header report of a volume, a transform or a warp field: sizes, voxel sizes, orientation, every matrix, the header's tags and the whole-volume answers (statistics, sums, entropy), which recon-all prints into its log and asks for the number of frames and whether a volume is conformed."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete; it runs as the larmorx-freesurfer program `mri_info`, with every option, message and exit status. It writes no volume, so it is no recorded step of its own: the 72 calls recon-all and its segmentation script make on the 18 recorded runs were run again against FreeSurfer's official program, 72 identical in both modes, and the 54 whose answer the logs hold identical to the logs. The whole program against the official one on 1,600 command lines of two seeds (every option, format, transform and warp field, missing and odd names): 1,567 identical in reproduce mode, 0 different, 33 not comparable (FreeSurfer crashes or reads memory it does not own). Peak memory 6 to 19 % below FreeSurfer's on four calls (5.0 MiB against 6.2 for the report). Eight new defects of FreeSurfer recorded (FS-1146 to FS-1153), among them two options that print the wrong axis's size and a crash on a singular matrix."
      - name: "mri_add_xform_to_header"
        what: "Writes a transform's name (and, when asked, the transform itself) into a volume's header, as recon-all does for the conformed volume and its intensity-corrected copy before the Talairach transform exists."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete; it runs as the larmorx-freesurfer program `mri_add_xform_to_header`, with every option, message and exit status, COR folders' info file included. The 24 recorded steps of the 12 recorded runs replayed: 24 identical in both modes. The whole program against FreeSurfer's official program on 1,605 command lines of two seeds and extra cases (every option, transform file and output format, missing and odd names, a name of 1,104 bytes): 1,500 identical in reproduce mode, 0 different, 105 not comparable (FreeSurfer crashes or reads memory it does not own). Peak memory 6 to 9 % below FreeSurfer's (21 MiB against 22.5 for recon-all's call). Five new defects of FreeSurfer recorded (FS-1154 to FS-1158), among them a failed write that still ends with status 0 and a slice thickness written as the pixel size."
      - name: "lta_convert"
        what: "Converts a transform between FreeSurfer's, FSL's, MINC's, ITK's, NiftyReg's and register.dat's forms, inverts it, gives it new geometries: recon-all's step and the calls fMRIPrep, sMRIPrep and bbregister make for the anatomical-to-functional transforms."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete; it runs as the larmorx-freesurfer program `lta_convert`, with every option, input and output format, message and exit status. The 12 recorded steps of the 12 recorded runs replayed: 12 identical in both modes. fMRIPrep's, sMRIPrep's and bbregister's calls on the transforms and volumes of 3 recorded heads: 21 identical to FreeSurfer's official program. The whole program against the official one on 1,403 command lines of two seeds and extra cases: 1,247 identical in reproduce mode, 0 different, 156 not comparable (FreeSurfer crashes, aborts, never ends or reads memory it never wrote). Peak memory as FreeSurfer's (5.5 to 6 MiB). Twelve new defects of FreeSurfer recorded (FS-1159 to FS-1170)."
      - name: "fs_temp_file"
        what: "Makes a temporary file or folder with a unique name, as recon-all's scripts do for their working files."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete, every option and path; it runs as the larmorx-freesurfer program `fs_temp_file`, its files private to their owner as FreeSurfer's are. 73 command lines identical to FreeSurfer's official program, recon-all's call included; peak memory just below FreeSurfer's (4.0 MiB against 4.5). Two new defects of FreeSurfer recorded (FS-1171, FS-1172), among them an unusable folder replaced without a word."
      - name: "getfullpath"
        what: "FreeSurfer's 42-line shell script that turns a file name into its full path, run by the synthmorph registration and the corpus callosum segmentation."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete; it runs as the larmorx-freesurfer program `getfullpath`. By default the name is taken as given; in reproduce mode a measured model of the C shell's reading of words gives FreeSurfer's results. The 54 recorded calls of 18 runs identical in both modes; 134 fixed and 1,500 random names, 0 different; 111 rare shell forms (bracket ranges, a new line in a name) not reproduced, counted, both modes then the name as given with a notice. Four new defects of FreeSurfer recorded (FS-1173 to FS-1176)."
      - name: "mri_binarize"
        what: "Thresholds, label matches and masks: the white-matter mask, the cortex and its inverse, the counts of the white matter's edits, the ones and masks of the bias correction script, with every option, its stand-alone modes and the topology fix of a label."
        replica: "done 2026-11-21"
        clean_room: "planned"
        note: "Complete; it runs as the larmorx-freesurfer program `mri_binarize`. It is no recorded step of its own, so the 81 calls recon-all and its scripts make on six recorded runs were replayed: 78 identical to FreeSurfer's in reproduce mode, 0 different, 3 not comparable (FreeSurfer writes into a volume it has already freed). The whole program against FreeSurfer's official program on 130 command lines covering every option and failure, two seeds: 122 identical each time, 0 different, 8 not comparable (FreeSurfer crashes, writes past its lists, reads memory it does not own or runs out of address space). Peak memory 2 to 4 % below FreeSurfer's on four calls. Still slower: the 81 calls take 204 s against FreeSurfer's 177 s, the time in per-voxel reads and writes, for a later speed step. Ten new defects of FreeSurfer recorded (FS-1018 to FS-1027), among them a crash with the full colour table and a voxel the topology fix drops on a real hippocampus."
      - name: "mri_robust_register"
        what: "Reuter's robust registration of two volumes, which fMRIPrep runs through sMRIPrep to bring FreeSurfer's conformed T1 back onto the original T1w: rigid or affine, symmetric, with intensity scaling."
        replica: "in-progress 2026-11-22"
        clean_room: "planned"
        note: "Part 1 done 2026-11-22: the program with every option, message and output for its robust cost, the path fMRIPrep takes. fMRIPrep's call on six recorded heads: the same transform as FreeSurfer's official program on all six in both modes, every output identical on the two heads run with all of them (one head prints the final transform's last two digits differently, 2e-13 of 210, while its file is identical: being settled). The whole program against the official one on 900 command lines of three seeds: 839 identical, 0 different, 25 not comparable (FreeSurfer's result undefined), 36 on paths not ported yet. Peak memory as FreeSurfer's (1,106 MiB against 1,100); 2.0 to 2.3 times slower for now, for a later speed step. Four new defects recorded (FS-1070 to FS-1073). Part 2 follows: the other cost functions, the debugging outputs, the entropy images and the test mode."
      - name: "mri_segstats"
        what: "The statistics of each region of a segmentation: volumes, means and spreads of an intensity image, partial-volume corrections, masks, colour tables, waveforms and the brain-volume measures, behind recon-all's aseg.stats and wmparc.stats and the bias correction script's mean."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete but one function; it runs as the larmorx-freesurfer program `mri_segstats`, with every option and its four stand-alone modes. The brain-volume measures computed from the subject's surfaces (when `stats/brainvol.stats` is missing, or with `--no-cached`) come with the surfaces (wave 3.5) and stop with an error saying so for now; every recorded step reads that file. recon-all's 24 recorded steps (aseg.stats and wmparc.stats on six heads, both streams), replayed: 24 identical in reproduce mode and 24 in fix mode, 1,005 s at four threads against FreeSurfer's 1,151 s. The whole program against FreeSurfer's official program on 145 command lines, two seeds: 138 identical each time, 0 different, 7 not comparable (FreeSurfer crashes or reads memory it never wrote). Peak memory 18 to 31 % below FreeSurfer's on three calls (150 to 185 MiB against 183 to 234). Still slower at one thread: the white-matter parcellation's statistics take 149 s against FreeSurfer's 81 s (26 s at ten threads), the time in a per-window label count of the volume library, for a later speed step. Eighteen new defects of FreeSurfer recorded (FS-1101 to FS-1118)."
      - name: "mris_calc"
        what: "Arithmetic on volumes and surface value files: the bias correction script's rescale, recon-all's vertex areas and the cortex mask of a surface overlay, with every action, statistic and failure."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete, volumes and surface value files alike; it runs as the larmorx-freesurfer program `mris_calc`. It is no recorded step of its own, so the 30 calls recon-all and its scripts make on six recorded runs were run again: 30 identical in both modes, and the vertex areas identical to the runs' own files. The whole program against FreeSurfer's official program on 228 command lines (every action on values with NaN, infinite and denormal numbers, the statistics, the failures), two seeds: 223 identical each time, 0 different, 5 not comparable (FreeSurfer reads memory it never wrote or writes outside its mask). Peak memory at or just below FreeSurfer's on three calls (197 MiB against 198 for the rescale of a 256-cubed volume); about as fast (12.6 s against 12.3 s for the 30 calls). Eight new defects of FreeSurfer recorded (FS-1119 to FS-1126), among them a failed write that still ends with status 0 and crashes on an action without its second input."
      - name: "mri_make_uchar"
        what: "Turns the bias-corrected volume of `mri_nu_correct.mni` into bytes, scaling its intensities so that the white matter found through the Talairach transform lands at 110, with its histogram and cumulative files."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete; it runs as the larmorx-freesurfer program `mri_make_uchar`, with every option, message and exit status. It is no recorded step of its own (the script runs it on a file the runs do not keep), so its call was run on 6 recorded runs with stand-ins against FreeSurfer's official program: 18 identical in both modes. The whole program against the official one on 103 command lines, two seeds: 102 identical each time, 0 different, 1 not comparable (FreeSurfer reads memory it never wrote when a volume is named as the transform). Peak memory a tenth of FreeSurfer's (85 MiB against 599 for the call itself); 1.4 times slower for now (the per-voxel transform of a point), for a later speed step. Five new defects of FreeSurfer recorded (FS-1127 to FS-1131), among them two crashes and outputs not written that still end with status 0."
      - name: "mri_mask"
        what: "Masks a volume with another, as recon-all does several times (the brain mask among them), with thresholds, dilation, a transform between the two volumes and label masks."
        replica: "done 2026-11-22"
        clean_room: "planned"
        note: "Complete, every option; it runs as the larmorx-freesurfer program `mri_mask`. Its 24 recorded steps on 12 runs reproduced in both modes, and 12 more calls on recorded heads (the classic runs' morph, the version 8 scripts' brain-extraction and bounding-box calls) identical. The whole program against FreeSurfer's official program on 193 command lines, two seeds: 192 identical each time, 0 different, 1 counted (an input the volume library refuses in both modes). Three rare paths where FreeSurfer crashes (a bounding box that finds no region, transforms that do not chain, a transform singular from voxel to voxel) end with a clear error by default and give FreeSurfer's own status in reproduce mode. Peak memory just below FreeSurfer's (70 MiB against 72, 166 against 168). Four new defects of FreeSurfer recorded (FS-1132 to FS-1135)."
      - name: "The robust-registration library"
        what: "Reuter's robust registration, shared by `mri_robust_register` and `mri_robust_template` (both run by fMRIPrep): image scaling, subsampling, blurring and gradients, principal axes, matrix decompositions and transform distances, then the registration itself."
        replica: "in-progress 2026-11-18"
        clean_room: "planned"
        note: "Part 1 of 2 done (2026-11-20): the helpers both programs reach, with the matrix square root, which the default symmetric registration takes at every step. Checked against FreeSurfer's own files built with its flags: 16,100 random calls, 15,737 identical, 0 different, 363 not comparable (FreeSurfer crashes, hangs or reads memory it does not own); the square root and its complex Schur form (reference LAPACK's, as FreeSurfer's build links it) on 10,200 random matrices: 10,061 identical in reproduce mode, its error messages byte for byte, 0 different, 139 not yet ported (matrices holding a NaN or an infinity, which a registration never makes), and 2.7 times as fast as FreeSurfer's (200,000 square roots of 4-by-4 transforms in 0.27 s against 0.73 s). Inside it the complex absolute value and square root take the correctly rounded hypotenuse in both modes, as decided for the confounds; whether FreeSurfer's own last bits would change a registration is measured at the programs' replays. After a fix of the foundations' filter (2026-11-19) the gradients are faster than FreeSurfer's (0.58 s against 0.81 s on a 256-voxel cube) and the blur 1.7 times slower (0.66 s against 0.39 s), both with slightly less memory than FreeSurfer's; the blur's remaining time is a frame copy in the volume library, for a later speed step. Five new defects of FreeSurfer recorded (FS-966 to FS-970). Part 2, the registration itself, in two steps: the first done 2026-11-22, the robust statistics, the robust and least-squares solvers, the rotations as quaternions, all fifteen transformation models and one registration step (the weighted system and its solution). Against FreeSurfer's own files: 4,000 random steps of three seeds, 3,676 identical in reproduce mode, 0 different, 305 not comparable (FreeSurfer crashes or reads memory it does not own), 19 not yet ported (least-squares steps with fewer usable voxels than parameters). Peak memory 3 to 7 % below FreeSurfer's, after a fix of the foundations' allocator that lowers every program's memory; still slower, a step on a 128-voxel cube 0.66 s against 0.45 s, for a later speed step. Seven new defects recorded (FS-1061 to FS-1067). The second step done 2026-11-22: the registration itself, the images' set-up and reorientation, the resolution pyramids, the four initial transforms (centroids, orientation, moments), the iterations with the symmetric half-way maps, the multi-resolution registration, the search for the saturation and the final and half-way maps. Against FreeSurfer's own files: 1,360 random registrations of small volume pairs, three seeds, 1,274 identical in reproduce mode, 0 different, 86 not comparable (FreeSurfer crashes or reads memory it does not own). Two new defects recorded (FS-1068, FS-1069: half-way maps asked for before any iteration, a step on two images of different sizes), both clear errors. The library is complete but its debugging outputs, which come with `mri_robust_register`'s rest."

