        command: "larmorx afni 3dAutomask"
        also: ""
        python: "lx.afni.automask"
        does: "`3dAutomask` makes a brain mask from an EPI series or a skull-stripped anatomical image."
        original: "AFNI 26.3.05"
        api: "docs/api/afni-automask.md"
        evidence: "/evidence/afni-automask/"
        reference: "/programs/afni/3dAutomask/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
          - {kind: clean-room, name: "clean room", package: larmorx, status: "validated", next_release: false}
      - name: "3dUnifize"
        kind: program
        command: "larmorx afni 3dUnifize"
        also: ""
        python: "lx.afni.unifize"
        does: "`3dUnifize` makes the white-matter intensity of a T1-weighted volume uniform across space and scales it to about 1000 (or, with `-T2`, of a T2-weighted one; with `-EPI`, of an EPI series)."
        original: "AFNI 26.3.05"
        api: "docs/api/afni-unifize.md"
        evidence: "/evidence/afni-unifize/"
        reference: "/programs/afni/3dUnifize/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
          - {kind: clean-room, name: "clean room", package: larmorx, status: "validated", next_release: false}
