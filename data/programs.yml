# The Programs page's data (content/programs/index.md), generated by the main repository:
#     python -m larmorx_validation reference programs --site <this checkout>
# from its validation/programs.toml, the code (the commands, the replica registry) and the
# records' status (validation/tools.toml). Never edit it here.
groups:
  - id: ants
    name: "ANTs and ITK"
    original: "ANTs 2.6.5 on ITK 5.4.5"
    count: "13 programs and 1 module"
    summary: "Transforms and their files, N4, denoising, `ImageMath` and its filters, registration (linear and deformable stages), `antsAI`, `Atropos`."
    ports:
      - {kind: replica, name: "replica", package: larmorx, licence: "Apache-2.0", count: 14, next_release: false}
    programs:
      - name: "antsRegistration"
        kind: program
        command: "larmorx ants antsRegistration"
        also: ""
        python: "lx.ants.registration"
        does: "`antsRegistration` registers one image to another, stage by stage."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-registration.md"
        evidence: "/evidence/ants-registration/"
        reference: "/programs/ants/antsRegistration/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "N4BiasFieldCorrection"
        kind: program
        command: "larmorx ants N4BiasFieldCorrection"
        also: ""
        python: "lx.ants.n4_bias_field_correction"
        does: "`N4BiasFieldCorrection` removes a smooth intensity bias field from an image."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-n4.md"
        evidence: "/evidence/ants-n4/"
        reference: "/programs/ants/N4BiasFieldCorrection/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "DenoiseImage"
        kind: program
        command: "larmorx ants DenoiseImage"
        also: ""
        python: "lx.ants.denoise_image"
        does: "`DenoiseImage` denoises an image by adaptive non-local means."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-denoise.md"
        evidence: "/evidence/ants-denoise/"
        reference: "/programs/ants/DenoiseImage/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "antsApplyTransforms"
        kind: program
        command: "larmorx ants antsApplyTransforms"
        also: ""
        python: "lx.ants.apply_transforms"
        does: "`antsApplyTransforms` resamples an image onto the grid of a reference image through a chain of ITK transforms (linear transforms, displacement fields, B-spline transforms and composites of them), or writes the chain itself as one transform."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-apply-transforms.md"
        evidence: "/evidence/ants-apply-transforms/"
        reference: "/programs/ants/antsApplyTransforms/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "ImageMath"
        kind: program
        command: "larmorx ants ImageMath"
        also: ""
        python: "lx.ants.image_math"
        does: "`ImageMath` applies one operation to an image (and to a second image or numbers): arithmetic, intensity clipping and scaling, Gaussian filters, binary and grayscale morphology, hole filling, padding, connected components and distance maps."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-image-math.md"
        evidence: "/evidence/ants-programs/"
        reference: "/programs/ants/ImageMath/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "ThresholdImage"
        kind: program
        command: "larmorx ants ThresholdImage"
        also: ""
        python: "lx.ants.threshold_image"
        does: "`ThresholdImage` sets the voxels between two bounds to one value and the others to another, or labels an image's classes by Otsu's thresholds."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-threshold-image.md"
        evidence: "/evidence/ants-programs/"
        reference: "/programs/ants/ThresholdImage/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "MultiplyImages"
        kind: program
        command: "larmorx ants MultiplyImages"
        also: ""
        python: "lx.ants.multiply_images"
        does: "`MultiplyImages` multiplies an image by another image or by a number."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-multiply-images.md"
        evidence: "/evidence/ants-programs/"
        reference: "/programs/ants/MultiplyImages/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "SmoothImage"
        kind: program
        command: "larmorx ants SmoothImage"
        also: ""
        python: "lx.ants.smooth_image"
        does: "`SmoothImage` smooths an image with a Gaussian of a given sigma, in voxels or in millimetres, or filters it with a median over a box of a given radius."
        original: "ANTs 2.6.5 on ITK 5.4.5"
