        evidence: "/evidence/ants-programs/"
        reference: "/programs/ants/SmoothImage/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "ResampleImage"
        kind: program
        command: "larmorx ants ResampleImage"
        also: ""
        python: "lx.ants.resample_image"
        does: "`ResampleImage` resamples an image onto a grid with a new spacing or a new size, keeping its origin and direction, by linear, nearest-neighbour, Gaussian, windowed-sinc or B-spline interpolation, and writes it in one of ANTs' eight pixel types."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-resample-image.md"
        evidence: "/evidence/ants-programs/"
        reference: "/programs/ants/ResampleImage/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "ResampleImageBySpacing"
        kind: program
        command: "larmorx ants ResampleImageBySpacing"
        also: ""
        python: "lx.ants.resample_image_by_spacing"
        does: "`ResampleImageBySpacing` resamples an image onto a grid with a new spacing, keeping its origin and direction, after smoothing it with a Gaussian where the spacing grows, by linear or nearest-neighbour interpolation."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-resample-image-by-spacing.md"
        evidence: "/evidence/ants-programs/"
        reference: "/programs/ants/ResampleImageBySpacing/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "antsAI"
        kind: program
        command: "larmorx ants antsAI"
        also: ""
        python: "lx.ants.ai"
        does: "`antsAI` finds the linear transform that best aligns two images."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-ai.md"
        evidence: "/evidence/ants-ai/"
        reference: "/programs/ants/antsAI/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "antsAffineInitializer"
        kind: program
        command: "larmorx ants antsAffineInitializer"
        also: ""
        python: "lx.ants.affine_initializer"
        does: "`antsAffineInitializer` finds an affine transform that aligns two images."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-affine-initializer.md"
        evidence: "/evidence/ants-ai/"
        reference: "/programs/ants/antsAffineInitializer/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "Atropos"
        kind: program
        command: "larmorx ants Atropos"
        also: ""
        python: "lx.ants.atropos"
        does: "`Atropos` segments an image into tissue classes by a finite mixture model with a Markov random field prior."
        original: "ANTs 2.6.5 on ITK 5.4.5"
        api: "docs/api/ants-atropos.md"
        evidence: "/evidence/ants-atropos/"
        reference: "/programs/ants/Atropos/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
      - name: "transforms-hdf5"
        kind: module
        command: ""
        also: ""
        python: "lx.transforms.read"
        does: "ITK's transform files, text, MATLAB and HDF5 (`.h5`), read and written in pure Rust."
        original: "ITK 5.4.5 on HDF5 1.12.1"
        api: "docs/api/transforms-hdf5.md"
        evidence: "/evidence/itk-hdf5/"
        reference: ""
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
  - id: afni
    name: "AFNI"
    original: "AFNI 26.3.05"
    count: "4 programs"
    summary: "`3dTshift`, `3dAutomask`, `3dUnifize` and `3dvolreg`. AFNI 26.3.05 released the Medical College of Wisconsin's code under CC BY 4.0, so the replicas are in `larmorx` beside the clean rooms."
    ports:
      - {kind: replica, name: "replica", package: larmorx, licence: "Apache-2.0, with AFNI's CC BY 4.0 credit", count: 4, next_release: false}
      - {kind: clean-room, name: "clean room", package: larmorx, licence: "Apache-2.0", count: 4, next_release: false}
    programs:
      - name: "3dTshift"
        kind: program
        command: "larmorx afni 3dTshift"
        also: ""
        python: "lx.afni.tshift"
        does: "`3dTshift` corrects slice timing: it aligns every slice of a 4D series to one time origin."
        original: "AFNI 26.3.05"
        api: "docs/api/afni-tshift.md"
        evidence: "/evidence/afni-tshift/"
        reference: "/programs/afni/3dTshift/"
        ports:
          - {kind: replica, name: "replica", package: larmorx, status: "validated", next_release: false}
          - {kind: clean-room, name: "clean room", package: larmorx, status: "validated", next_release: false}
      - name: "3dAutomask"
