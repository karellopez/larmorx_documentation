# What LARMORX can do today and what is planned, as the main repository's
# README states it (Supported tools, Roadmap). Keep the two apart and claim
# nothing the README does not. Links written `repo:<path>` go to that file in
# the main repository; the build checks the file exists there when the
# repository is checked out next to this one.
#
# `eco` is the software a row's program comes from (data/ecosystems.yml: its
# pastel and its name); `larmorx` marks LARMORX's own work. `page` is the
# program's evidence page. The planned steps follow the roadmap
# (content/roadmap.md), its next steps first.

