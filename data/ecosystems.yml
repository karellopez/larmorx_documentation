# The software ecosystems LARMORX draws from, each with its own pastel (the
# same in both themes) and a deeper variant of the same hue for marks on light
# paper (3:1 against it). LARMORX itself is the accent. The hero's points use
# the first five, in this order (tools/hero/make_hero.py). tedana, sdcflows and
# fMRIPrep (since 2026-11-12) come last, so the hero keeps its five; they were
# chosen and checked with the main repository's
# validation/investigations/docs-revision/pastels.py (the writing guide, §5).
