- { id: afni, name: AFNI, long: "AFNI", pastel: "#e3c779", deep: "#987e2e" }
- { id: fsl, name: FSL, long: "FSL", pastel: "#86cfc6", deep: "#438c84" }
- { id: freesurfer, name: FreeSurfer, long: "FreeSurfer", pastel: "#bba8ec", deep: "#9860f6" }
- { id: workbench, name: Workbench, long: "Connectome Workbench", pastel: "#eeaacd", deep: "#d8489f" }
- { id: larmorx, name: LARMORX, long: "LARMORX", pastel: "#f2b28a", deep: "#c76717" }
