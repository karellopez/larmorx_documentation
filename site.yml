# The site in one file: its name, where it lives, the repositories it links
# to and the navigation. tools/build.py reads it.

title: LARMORX
tagline: Bringing Neuroimaging Tools into Resonance.
description: >-
  Documentation for LARMORX, the Library of Algorithmic Reimplementations for
  MRI through Open Rust eXecution: programs from ANTs, AFNI, FSL and others,
  reimplemented in Rust and accessible through Python.
base_url: https://karellopez.github.io/larmorx_documentation/
lang: en-GB

# The project and this site's own sources. `repo_blob` is the prefix of a
# file in the main repository; `{{ repo('docs/validation/golden.md') }}` in a
# page links there, and the build checks the file exists when the main
# repository is checked out next to this one (../larmorx).
repo: https://github.com/karellopez/larmorx
repo_blob: https://github.com/karellopez/larmorx/blob/main/
repo_tree: https://github.com/karellopez/larmorx/tree/main/
docs_repo: https://github.com/karellopez/larmorx_documentation

# The header's links (the main repository's docs/writing-guide.md, section 6). A
# `url` is a path on this site, with an optional anchor.
nav:
  - { title: Getting started, url: "/getting-started/" }
  - { title: Concepts, url: "/concepts/" }
  - { title: Programs, url: "/programs/" }
  - { title: Validation, url: "/validation/" }
  - { title: Roadmap, url: "/roadmap/" }
  - { title: About, url: "/about/" }

# The documentation pages, in the order of the sidebar on a documentation page and
# of the footer's list.
docs:
  - { title: Overview, url: "/" }
  - { title: Getting started, url: "/getting-started/" }
  - { title: Concepts, url: "/concepts/" }
  - { title: Why Rust and Python, url: "/concepts/why-rust-and-python/" }
  - { title: Programs, url: "/programs/" }
  - { title: Validation, url: "/validation/" }
  - { title: Data panel, url: "/data-panel/" }
  - { title: Roadmap, url: "/roadmap/" }
  - { title: About, url: "/about/" }

# The evidence pages (content/evidence/<page>.md; content/tools/<page>.md keeps
# each old address as a redirect), listed under "Evidence" in the sidebar in the
# Programs page's order of the software; `eco` is a page's software (its group on the Programs page), and the
# sidebar lists the pages under a chip with that group's name and pastel (the
# main repository's docs/writing-guide.md, section 5: never a dot of its deep
# colour beside a program).
tools:
  - { title: antsRegistration, url: "/evidence/ants-registration/", eco: ants,
      summary: "Image registration with every stage ANTs has (linear, SyN, B-spline SyN, B-spline, displacement-field, exponential, velocity-field) and every image and point-set metric: a replica in larmorx." }
  - { title: N4BiasFieldCorrection, url: "/evidence/ants-n4/", eco: ants,
      summary: "Bias-field correction, as fMRIPrep, sMRIPrep and sdcflows call it: a replica in larmorx, ANTs' output bit for bit in reproduce, with correctly rounded maths." }
  - { title: DenoiseImage, url: "/evidence/ants-denoise/", eco: ants,
      summary: "Non-local means denoising: a replica in larmorx, ANTs' single-thread result on any number of threads, with correctly rounded maths." }
  - { title: antsApplyTransforms, url: "/evidence/ants-apply-transforms/", eco: ants,
      summary: "Resampling through ITK transforms, in double precision and with --float 1, and the transforms it writes: a replica in larmorx." }
  - { title: "ImageMath and the filters", url: "/evidence/ants-programs/", eco: ants,
      summary: "ImageMath, ThresholdImage, MultiplyImages, SmoothImage, ResampleImage and ResampleImageBySpacing: a replica of each in larmorx." }
  - { title: "antsAI, antsAffineInitializer", url: "/evidence/ants-ai/", eco: ants,
      summary: "Initial alignments, the multi-start search and the blob alignment: a replica of each in larmorx." }
  - { title: Atropos, url: "/evidence/ants-atropos/", eco: ants,
      summary: "Finite-mixture segmentation with an MRF, every initialization, likelihood and outlier option: a replica in larmorx." }
  - { title: ITK transform files, url: "/evidence/itk-hdf5/", eco: ants,
      summary: "Text, MATLAB and HDF5 transform files, read and written in pure Rust: a replica in larmorx." }
  - { title: 3dTshift, url: "/evidence/afni-tshift/", eco: afni,
      summary: "Slice-timing correction: a replica and a clean room, both in larmorx (the replica in larmorx-gpl until 2026-10-29); the replica gives AFNI's output bit for bit." }
  - { title: 3dAutomask, url: "/evidence/afni-automask/", eco: afni,
      summary: "A brain mask from intensities: a replica and a clean room, both in larmorx (the replica in larmorx-gpl until 2026-10-29); both give AFNI's masks bit for bit." }
  - { title: 3dUnifize, url: "/evidence/afni-unifize/", eco: afni,
      summary: "White-matter intensity uniformization: a replica and a clean room, both in larmorx (the replica in larmorx-gpl until 2026-10-29); the replica gives AFNI's output bit for bit." }
  - { title: 3dvolreg, url: "/evidence/afni-volreg/", eco: afni,
      summary: "Rigid-body registration of a series (fMRIPrep's BOLD references, sdcflows' PEPOLAR averages): a replica in larmorx, fMRIPrep's calls bit for bit, and a clean room (experimental, since 2026-11-08) within its specification's limits of AFNI's results, 2.8 to 5.2 times AFNI's speed on one thread." }
  - { title: BET, url: "/evidence/fsl-bet/", eco: fsl,
      summary: "Brain extraction (bet, bet2) and the skull and scalp (betsurf), with bet -S, -B, -A and -A2, standard_space_roi and fslroi: a replica in larmorx-nc and a clean room in larmorx (experimental; the variations and the two programs since 2026-11-05)." }
  - { title: FLIRT, url: "/evidence/fsl-flirt/", eco: fsl,
      summary: "Affine and boundary-based registration (flirt) with convert_xfm and FLIRT's other programs: a replica in larmorx-nc and a clean room in larmorx (experimental, brought up to its specification's answers on 2026-11-05 and 2026-11-07)." }
  - { title: FAST, url: "/evidence/fsl-fast/", eco: fsl,
      summary: "Tissue segmentation (fast): classes, partial volumes, the bias field, several channels, FSL's tissue priors; a replica in larmorx-nc, every compared case FSL's bytes, and a clean room in larmorx (experimental), fMRIPrep's call FSL's bytes in reproduce, FSL-202 and FSL-203 corrected by default as the replica corrects them, up to 67 times as fast." }
  - { title: topup and applytopup, url: "/evidence/fsl-topup/", eco: fsl,
      summary: "The susceptibility field from reversed phase encodings (topup) and its correction (applytopup): a replica in larmorx-nc, every compared case FSL's bytes, and a clean room in larmorx (experimental), fMRIPrep's call as close to FSL as FSL at another thread count, up to 41 times as fast." }
  - { title: fslmaths, url: "/evidence/fsl-maths/", eco: fsl,
      summary: "Image arithmetic, thresholds, filters, reductions, statistics and TFCE: a replica in larmorx-nc, fMRIPrep's mask combination and goodvoxels calls FSL's bytes, and a clean room in larmorx (experimental, since 2026-11-04), FSL's values in 370 of 391 compared cases, up to 268 times as fast." }
  - { title: fslstats, url: "/evidence/fsl-stats/", eco: fsl,
      summary: "Image statistics, per volume, per label and as JSON: a replica in larmorx-nc, every compared case FSL's text, and a clean room in larmorx (experimental, since 2026-11-04), FSL's numbers in 125 of 126 compared cases." }
  - { title: prelude, url: "/evidence/fsl-prelude/", eco: fsl,
      summary: "Phase unwrapping (prelude) of field maps' phase differences and complex images: a replica in larmorx-nc and a clean room in larmorx built for speed (since 2026-11-07: fMRIPrep's two large calls 97 and 211 times FSL's speed, FSL's bytes in reproduce), fMRIPrep's seven calls bit for bit in both." }
  - { title: Head-motion correction, url: "/evidence/mri-hmc/", eco: fsl,
      summary: "mcflirt: a replica in larmorx-nc, every compared case mcflirt's bytes, and a clean room in larmorx (experimental; its centres of mass as mcflirt's blocked sums since 2026-11-05, its correlation's count per point and least squares as FLIRT's since 2026-11-07)." }
  - { title: t2smap, url: "/evidence/tedana-t2smap/", eco: tedana,
      summary: "tedana's T2* and S0 maps of multi-echo fMRI and the echoes' optimal combination: a replica in larmorx-gpl (experimental), every file bit for bit in both library environments, fMRIPrep's calls included, and a clean room in larmorx (experimental, from the next release) within the specification's thresholds of tedana, 10 to 15 times its speed at one thread." }
  - { title: "sdcflows' field-map estimation", url: "/evidence/sdcflows-fieldmap/", eco: sdcflows,
      summary: "sdcflows' B-spline field fit, the field evaluated and applied, and the phase-difference preparation: a replica of sdcflows 2.17.1 in larmorx, fMRIPrep's seven phase-difference estimators bit for bit, the fit 6.5 to 7.8 times faster at 14 threads." }
  - { title: "sdcflows' PEPOLAR, direct and fieldmap-less estimation", url: "/evidence/sdcflows-estimation/", eco: sdcflows,
      summary: "sdcflows' PEPOLAR, direct and fieldmap-less (SyN) estimation, its masks and BIDS app, niworkflows' helpers and fMRIPrep's own field-map steps: a replica of sdcflows 2.17.1 and niworkflows 1.15.4 in larmorx, the app's every derivative bit for bit on the eight datasets of sdcflows' own runs." }
  - { title: One-shot BOLD resampler, url: "/evidence/resample-series/", eco: fmriprep,
      summary: "fMRIPrep's one-shot resampling (ResampleSeries) with nitransforms' chains and SciPy's interpolation: a replica in larmorx, the original's values bit for bit in every compared case and fMRIPrep's own output of a real run with its field map, PIPE-03 corrected by default, 4.1 to 5.2 times faster on one thread." }
  - { title: NIfTI I/O, url: "/evidence/nifti-io/", eco: larmorx,
      summary: "NIfTI-1 and NIfTI-2 reading and writing: LARMORX's own, compared with nibabel 5.4.2, every value and header field nibabel's in every compared case, the matrices too or within 4.2 × 10⁻¹³ mm of them." }
