# The site in one file: its name, where it lives, the repositories it links
# to and the navigation. tools/build.py reads it.

title: LARMORX
tagline: Bringing Neuroimaging Tools into Resonance.
description: >-
  Documentation for LARMORX, the Library of Algorithmic Reimplementations for
  MRI through Open Rust eXecution: established neuroimaging tools from ANTs,
  AFNI, FSL and others, reimplemented in Rust and accessible through Python.
base_url: https://karellopez.github.io/larmorx_documentation/
lang: en-GB

# The project and this site's own sources. `repo_blob` is the prefix of a
# file in the main repository; `{{ repo('docs/validation/golden.md') }}` in a
# page links there, and the build checks the file exists when the main
# repository is checked out next to this one (../larmorx).
repo: https://github.com/karellopez/larmorx
repo_blob: https://github.com/karellopez/larmorx/blob/main/
repo_tree: https://github.com/karellopez/larmorx/tree/main/
docs_repo: https://github.com/karellopez/larmorx_documentation

# The header's links. A `url` is a path on this site, with an optional anchor.
nav:
  - { title: What it is, url: "/#what-it-is" }
  - { title: Features, url: "/#features" }
  - { title: Philosophy, url: "/#philosophy" }
  - { title: Status, url: "/#status" }
  - { title: Install, url: "/installation/" }
  - { title: Validation, url: "/validation/" }
  - { title: Tools, url: "/tools/" }
  - { title: Roadmap, url: "/roadmap/" }

# The documentation pages, in the order of the sidebar on a documentation page.
docs:
  - { title: Overview, url: "/" }
  - { title: Installation, url: "/installation/" }
  - { title: Why Rust and Python, url: "/why-rust-and-python/" }
  - { title: Validation, url: "/validation/" }
  - { title: Data panel, url: "/data-panel/" }
  - { title: Tools, url: "/tools/" }
  - { title: Roadmap, url: "/roadmap/" }

# The tool pages (content/tools/<page>.md), listed under "Tools" in the sidebar
# in the order of the status table; `eco` colours the dot beside each.
tools:
  - { title: antsRegistration, url: "/tools/ants-registration/", eco: ants,
      summary: "Linear, SyN, B-spline SyN, B-spline and displacement-field stages; image and point-set metrics. Port." }
  - { title: N4BiasFieldCorrection, url: "/tools/ants-n4/", eco: ants,
      summary: "Bias-field correction, as fMRIPrep, sMRIPrep and sdcflows call it. Port." }
  - { title: DenoiseImage, url: "/tools/ants-denoise/", eco: ants,
      summary: "Non-local means denoising; ANTs' single-thread result at any thread count. Port." }
  - { title: antsApplyTransforms, url: "/tools/ants-apply-transforms/", eco: ants,
      summary: "Resampling through ITK transforms, in double and with --float 1; transform outputs. Port." }
  - { title: "ImageMath and the filters", url: "/tools/ants-programs/", eco: ants,
      summary: "ImageMath, ThresholdImage, MultiplyImages, SmoothImage, ResampleImage, ResampleImageBySpacing. Ports." }
  - { title: "antsAI, antsAffineInitializer", url: "/tools/ants-ai/", eco: ants,
      summary: "Initial alignments, the multi-start search and the blob alignment. Ports." }
  - { title: Atropos, url: "/tools/ants-atropos/", eco: ants,
      summary: "Finite-mixture segmentation with an MRF: every initialization, likelihood and outlier option. Port." }
  - { title: ITK transform files, url: "/tools/itk-hdf5/", eco: ants,
      summary: "Text, MATLAB and HDF5 transform files, read and written in pure Rust. Port." }
  - { title: 3dTshift, url: "/tools/afni-tshift/", eco: afni,
      summary: "Slice-timing correction: a clean-room original, and an exact replica in larmorx (in larmorx-gpl until 2026-10-29)." }
  - { title: 3dAutomask, url: "/tools/afni-automask/", eco: afni,
      summary: "A brain mask from intensities: a clean-room original, and an exact replica in larmorx (in larmorx-gpl until 2026-10-29)." }
  - { title: 3dUnifize, url: "/tools/afni-unifize/", eco: afni,
      summary: "White-matter intensity uniformization: a clean-room original, and an exact replica in larmorx (in larmorx-gpl until 2026-10-29)." }
  - { title: 3dvolreg, url: "/tools/afni-volreg/", eco: afni,
      summary: "Rigid-body registration of a series (fMRIPrep's BOLD references, sdcflows' PEPOLAR averages): a clean-room original (experimental, since 2026-11-08) within its specification's limits of AFNI's results, 2.8 to 5.2 times AFNI's speed on one thread, and an exact replica in larmorx, fMRIPrep's calls bit for bit." }
  - { title: BET, url: "/evidence/fsl-bet/", eco: fsl,
      summary: "Brain extraction (bet, bet2) and the skull and scalp (betsurf), with bet -S, -B, -A and -A2, standard_space_roi and fslroi: a clean-room original (experimental; the variations and the two programs since 2026-11-05) and an exact replica in larmorx-nc." }
  - { title: FLIRT, url: "/tools/fsl-flirt/", eco: fsl,
      summary: "Affine and boundary-based registration (flirt) with convert_xfm and FLIRT's other programs: a clean-room original (experimental, brought up to its specification's answers on 2026-11-05 and 2026-11-07) and an exact replica in larmorx-nc." }
  - { title: FAST, url: "/tools/fsl-fast/", eco: fsl,
      summary: "Tissue segmentation (fast): classes, partial volumes, the bias field, several channels, FSL's tissue priors; a clean-room original, fMRIPrep's call FSL's bytes in its reproduce mode, FSL-202 and FSL-203 corrected by default as the replica corrects them, up to 67 times faster, and an exact replica in larmorx-nc." }
  - { title: topup and applytopup, url: "/tools/fsl-topup/", eco: fsl,
      summary: "The susceptibility field from reversed phase encodings (topup) and its correction (applytopup): a clean-room original, fMRIPrep's call as close to FSL as FSL at another thread count and up to 41 times faster, and an exact replica in larmorx-nc." }
  - { title: fslmaths, url: "/tools/fsl-maths/", eco: fsl,
      summary: "Image arithmetic, thresholds, filters, reductions, statistics and TFCE: an exact replica in larmorx-nc, fMRIPrep's mask combination and goodvoxels calls bit for bit; a clean-room original built for speed (since 2026-11-04)." }
  - { title: fslstats, url: "/tools/fsl-stats/", eco: fsl,
      summary: "Image statistics, per volume, per label and as JSON: an exact replica in larmorx-nc and a clean-room original built for speed (since 2026-11-04)." }
  - { title: prelude, url: "/tools/fsl-prelude/", eco: fsl,
      summary: "Phase unwrapping (prelude) of field maps' phase differences and complex images: a clean-room original built for speed (since 2026-11-07: fMRIPrep's two large calls 97 and 211 times FSL's speed, FSL's bytes in its reproduce mode) and an exact replica in larmorx-nc, fMRIPrep's seven calls bit for bit in both." }
  - { title: Head-motion correction, url: "/tools/mri-hmc/", eco: fsl,
      summary: "mcflirt: a clean-room original (experimental; its centres of mass as mcflirt's blocked sums since 2026-11-05, its correlation's count per point and least squares as FLIRT's since 2026-11-07), and an exact replica in larmorx-nc." }
  - { title: One-shot BOLD resampler, url: "/tools/resample-series/", eco: larmorx,
      summary: "fMRIPrep's ResampleSeries, with nitransforms' chains and SciPy's interpolation. Port." }
  - { title: t2smap, url: "/tools/tedana-t2smap/", eco: larmorx,
      summary: "tedana's T2* and S0 maps of multi-echo fMRI and the echoes' optimal combination: a clean-room original (experimental) within the specification's thresholds of tedana, 10 to 15 times its speed at one thread, and an exact replica in larmorx-gpl (experimental), every file bit for bit in both library environments, fMRIPrep's calls included." }
  - { title: "sdcflows' field-map estimation", url: "/tools/sdcflows-fieldmap/", eco: larmorx,
      summary: "sdcflows' B-spline field fit, the field evaluated and applied, and the phase-difference preparation: a port of sdcflows 2.17.1, fMRIPrep's seven phase-difference estimators bit for bit, the fit 6.5 to 7.8 times faster at 14 threads. Port." }
  - { title: "sdcflows' PEPOLAR, direct and fieldmap-less estimation", url: "/tools/sdcflows-estimation/", eco: larmorx,
      summary: "sdcflows' PEPOLAR, direct and fieldmap-less (SyN) estimation, its masks and BIDS app, niworkflows' helpers and fMRIPrep's own field-map steps: a port of sdcflows 2.17.1 and niworkflows 1.15.4, the app's every derivative bit for bit on its eight oracle datasets. Port." }
  - { title: NIfTI I/O, url: "/tools/nifti-io/", eco: larmorx,
      summary: "NIfTI-1 and NIfTI-2 reading and writing, against nibabel. LARMORX's own." }
